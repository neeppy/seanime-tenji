name: Android

# Pull requests: typecheck + tests only.
# Manual run (Actions > Android > Run workflow): builds the phone and TV APKs as downloadable artifacts.
# Pushing a vX.Y.Z tag: builds both APKs, signed with the release keystore, and publishes a GitHub Release.
#
# Secrets:
#   SIGNING_PACKAGE_NAME       Android applicationId
#   SIGNING_KEYSTORE_BASE64    release keystore, base64-encoded
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
# Manual runs without the keystore secrets fall back to the debug keystore; tag builds refuse to.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  ANDROID_ARCHITECTURES: arm64-v8a

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-env.d.ts is generated by Expo and gitignored; it declares the *.css module type
      - name: Typecheck
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - run: npm test

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: phone
            expo-tv: "0"
            prefix: seanime-tenji
          - variant: tv
            expo-tv: "1"
            prefix: seanime-tenji-tv
    env:
      EXPO_TV: ${{ matrix.expo-tv }}
      SIGNING_PACKAGE_NAME: ${{ secrets.SIGNING_PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            label="$GITHUB_REF_NAME"
          else
            label="dev"
          fi
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=${{ matrix.prefix }}-$label-$code-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release"
            exit 1
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; this APK is signed with the debug keystore"
          fi
          if [[ -z "$SIGNING_PACKAGE_NAME" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::SIGNING_PACKAGE_NAME is not set"
              exit 1
            fi
            echo "::warning::SIGNING_PACKAGE_NAME is not set; using the upstream package name"
          fi

      - run: npm ci

      - name: Fetch libmpv
        run: node tools/fetch-mpv-libs.mjs

      - name: Expo prebuild
        run: npx expo prebuild -p android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME.apk"
          (cd dist && sha256sum "$APK_NAME.apk" > "$APK_NAME.apk.sha256")
          echo "Native libraries:"
          unzip -Z1 "dist/$APK_NAME.apk" 'lib/*'
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
